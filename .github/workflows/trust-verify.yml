# Trust Verify — adopts the Flow Agents external trust anchor on this repo (ADVISORY).
#
# On every PR, re-runs this repo's canonical verification FRESH in a clean CI
# environment an agent does not control — the same `npm run verify` that ci.yml's
# "verify" job runs (ADR/decisions integrity check, typecheck, build+test, and the
# package-contents check). If a Flow Agents session has published
# delivery/trust.bundle, it also RECONCILES the agent's claimed passes against
# CI's own fresh results and fails on any divergence. When no bundle is present,
# only the fresh verify is enforced (fail-open on bundle absence; fail-closed on
# divergence when present).
#
# NOTE: ci.yml in this repo is currently workflow_dispatch-only (no pull_request
# trigger). This workflow adds its own independent `on: pull_request` trigger so
# the anchor runs on every PR regardless of ci.yml's own trigger configuration.
#
# ADVISORY PHASE: this workflow runs and reports but does NOT block merges yet.
# To ARM it: add "Trust Verify" as a required, no-bypass status check in this
# repo's branch protection (Settings → Branches → main).
#
# Adoption guide: https://github.com/kontourai/flow-agents/blob/main/docs/trust-anchor-adoption.md
name: Trust Verify

on:
  pull_request:

permissions:
  contents: read

jobs:
  trust-verify:
    name: Trust Verify
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: the reconciler binds delivery bundles to commits via
      # `git merge-base --is-ancestor`, which cannot walk a shallow clone —
      # with the default depth-1 checkout every committed bundle looks stale
      # in CI (sealed commit never equals the synthetic merge SHA).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts --no-fund --no-audit

      # The external anchor: re-run this repo's real verify fresh + reconcile any
      # delivered bundle. SHA-pinned (mutable tags are not trusted for a cross-repo
      # action that gates merges).
      #
      # verify-command mirrors ci.yml's "verify" job exactly: `npm run verify`,
      # i.e. check:decisions (ADR index/freeze integrity), typecheck, npm test
      # (build + node --test suite), then check:pack.
      - uses: kontourai/flow-agents/.github/actions/trust-verify@e5f348b49f8130f9d452e73b104ba328f9916981 # flow-agents @ reports which DECLARED condition failed (#1015)
        with:
          verify-command: "npm run verify"

  trust-advisory-comment:
    if: >-
      ${{ always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    needs: trust-verify
    permissions:
      pull-requests: write
    uses: kontourai/.github/.github/workflows/trust-advisory-comment.yml@66f62973ae2f01adf9abbcc2baff62f0a57d96a0
    with:
      check-name: Trust Verify
      pr-number: ${{ github.event.pull_request.number }}
      result: ${{ needs['trust-verify'].result }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
